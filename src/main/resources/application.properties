spring.application.name=mcp-bank-tdea

# Configuracion del Servidor MCP
spring.ai.mcp.server.name=bank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true

# Desactivar servidor web y banner para comunicacion limpia por stdio
spring.main.web-application-type=none
spring.main.banner-mode=off

# Silenciamiento de consola para proteger el canal JSON-RPC (Claude Desktop)
logging.threshold.console=OFF
logging.file.name=./target/mcp-bank-tdea.log

# Configuracion de Base de Datos H2 persistente en archivo local
spring.datasource.url=jdbc:h2:file:./data/bankdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
